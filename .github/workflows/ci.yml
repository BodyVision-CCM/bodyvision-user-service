name: CI utilisateurs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Installer Ruff
        run: python -m pip install ruff==0.17.3

      # shortcut: seules les erreurs Python bloquantes sont contrôlées ; étendre les règles dans un ticket de qualité dédié.
      - name: Vérifier le code Python
        run: ruff check --select E9,F63,F7,F82 --output-format github app migrations tests

      - name: Tester avec PostgreSQL
        run: make test

  trivy:
    name: Image Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l’image de production
        run: docker build --pull --target runtime -t bodyvision/auth:${{ github.sha }} .

      - name: Bloquer les vulnérabilités critiques
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: bodyvision/auth:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
