name: Sécurité Trivy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Image Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construire l’image de production
        run: docker build --pull --target runtime -t bodyvision/auth:${{ github.sha }} .

      - name: Bloquer les vulnérabilités critiques
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: bodyvision/auth:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
